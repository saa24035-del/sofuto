<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西条農業 タウン＆アグリプラットフォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-emerald-50/50 min-h-screen text-slate-800">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-emerald-700 to-green-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
          <i class="fa-solid fa-seedling text-2xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="font-bold text-xl md:text-2xl tracking-wide">西条農業 アグリハブ</h1>
          <p class="text-xs text-emerald-100">スマート実習ログ ＆ 直売所リアルタイム情報</p>
        </div>
      </div>
      <div id="auth-status" class="text-xs bg-emerald-800/60 px-3 py-1.5 rounded-full flex items-center gap-2 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span>接続確認中...</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">

    <!-- システム概要バナー -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-emerald-100 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="space-y-1">
        <h2 class="text-lg font-bold text-emerald-900 flex items-center gap-2">
          <i class="fa-solid fa-circle-info text-emerald-600"></i>
          ソフトウェア開発課題：アグリデータ管理システム
        </h2>
        <p class="text-sm text-slate-600">
          生徒の日々の「生育・観察記録」と、地域に向けた「直売所の出品状況」をFirebase (Cloud Firestore) で一元管理・リアルタイム同期するシステムです。
        </p>
      </div>
    </section>

    <!-- 入力フォーム ＆ 概要 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 入力フォーム -->
      <section class="lg:col-span-1 bg-white rounded-2xl p-6 shadow-md border border-emerald-100 h-fit">
        <h3 class="text-base font-bold text-slate-800 pb-3 border-b border-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 新規データの登録
        </h3>

        <form id="agri-form" class="mt-4 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">区分・カテゴリー</label>
            <select id="category" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 border outline-none transition">
              <option value="直売所出品">🛒 直売所出品（野菜・果物・加工品）</option>
              <option value="実習記録">🌱 ほ場・栽培観察ログ</option>
              <option value="研究発表">💡 課題研究・プロジェクト</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">タイトル・品目名</label>
            <input type="text" id="title" placeholder="例: シャインマスカット, 3号温室イチゴ" required
              class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 border outline-none transition">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">部門・担当学科</label>
            <select id="department" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 border outline-none transition">
              <option value="食料生産科">食料生産科</option>
              <option value="環境工学科">環境工学科</option>
              <option value="生活光風科">生活光風科</option>
              <option value="全校共通">全校共通 / 直売所</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">詳細内容・状態</label>
            <textarea id="details" rows="3" placeholder="例: 糖度18度達成。本日10時より直売所にて20パック限定で販売開始します。" required
              class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 border outline-none transition"></textarea>
          </div>

          <button type="submit" id="submit-btn"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Firebaseに送信</span>
          </button>
        </form>
      </section>

      <!-- 表示エリア -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- タブ切り替えボタン -->
        <div class="flex border-b border-slate-200 bg-white rounded-xl p-1 shadow-sm">
          <button id="tab-all" onclick="filterCategory('all')" class="tab-btn flex-1 py-2 text-xs md:text-sm font-bold text-center rounded-lg bg-emerald-600 text-white transition-all">
            すべてを表示
          </button>
          <button id="tab-market" onclick="filterCategory('直売所出品')" class="tab-btn flex-1 py-2 text-xs md:text-sm font-bold text-center text-slate-600 hover:text-emerald-600 rounded-lg transition-all">
            🛒 直売所情報
          </button>
          <button id="tab-farm" onclick="filterCategory('実習記録')" class="tab-btn flex-1 py-2 text-xs md:text-sm font-bold text-center text-slate-600 hover:text-emerald-600 rounded-lg transition-all">
            🌱 栽培観察ログ
          </button>
        </div>

        <!-- タイムライン・カード一覧 -->
        <div id="posts-container" class="space-y-4">
          <div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-dashed border-slate-300">
            <i class="fa-solid fa-spinner animate-spin text-2xl text-emerald-600 mb-2"></i>
            <p class="text-sm">Firebaseから最新データを同期中...</p>
          </div>
        </div>

      </div>

    </div>

  </main>

  <footer class="max-w-5xl mx-auto px-4 py-8 text-center text-xs text-slate-400 border-t border-emerald-100 mt-12">
    <p>西条農業高等学校 ソフトウェア開発実習課題 Project</p>
    <p class="mt-1">Powered by Firebase Firestore & Authentication</p>
  </footer>

  <!-- Firebase SDK v10 (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 設定オブジェクト
    const firebaseConfig = {
      apiKey: "AIzaSyARA_w_h87l_xcLS32qCeHyOHzkQvH_M4g",
      authDomain: "sofuto-c57bd.firebaseapp.com",
      projectId: "sofuto-c57bd",
      storageBucket: "sofuto-c57bd.firebasestorage.app",
      messagingSenderId: "239177252587",
      appId: "1:239177252587:web:738606cc1ee4582e2a48ae"
    };

    // 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allPosts = [];
    let currentFilter = 'all';

    // 匿名認証実行
    signInAnonymously(auth).catch((err) => {
      console.error("認証エラー:", err);
      document.getElementById("auth-status").innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> 認証エラー`;
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth-status").innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Firebase接続完了`;
      }
    });

    // リアルタイムリスナー設定
    const q = query(collection(db, "saijo_agri_posts"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      allPosts = [];
      snapshot.forEach((docSnapshot) => {
        allPosts.push({
          id: docSnapshot.id,
          ...docSnapshot.data()
        });
      });
      renderPosts();
    }, (error) => {
      console.error("Firestore同期エラー:", error);
      document.getElementById("posts-container").innerHTML = `
        <div class="bg-red-50 p-6 rounded-2xl text-center text-red-600 border border-red-200">
          <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
          <p class="font-bold">データの取得に失敗しました</p>
          <p class="text-xs mt-1">FirebaseコンソールのFirestore Rule設定（アクセス権限）を確認してください。</p>
        </div>
      `;
    });

    // データの描画関数
    function renderPosts() {
      const container = document.getElementById("posts-container");
      
      const filtered = currentFilter === 'all' 
        ? allPosts 
        : allPosts.filter(p => p.category === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-2xl text-center text-slate-400 border border-slate-200">
            <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-300"></i>
            <p class="text-sm font-medium">該当する投稿データがありません</p>
            <p class="text-xs text-slate-400 mt-1">左側のフォームから新しいデータを登録してみましょう。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(post => {
        const timeStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString('ja-JP', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '送信中...';

        const categoryColors = {
          '直売所出品': 'bg-amber-100 text-amber-800 border-amber-200',
          '実習記録': 'bg-emerald-100 text-emerald-800 border-emerald-200',
          '研究発表': 'bg-blue-100 text-blue-800 border-blue-200'
        };

        const badgeClass = categoryColors[post.category] || 'bg-slate-100 text-slate-800';

        return `
          <article class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition-all space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div class="space-y-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs px-2.5 py-0.5 rounded-full font-bold border ${badgeClass}">
                    ${escapeHtml(post.category)}
                  </span>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                    ${escapeHtml(post.department || '全校')}
                  </span>
                </div>
                <h4 class="text-base font-bold text-slate-800 pt-1">
                  ${escapeHtml(post.title)}
                </h4>
              </div>
              <button onclick="deletePost('${post.id}')" title="削除" class="text-slate-300 hover:text-red-500 p-1 transition">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>

            <p class="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
              ${escapeHtml(post.details)}
            </p>

            <div class="flex justify-between items-center text-xs text-slate-400 pt-1">
              <span class="flex items-center gap-1">
                <i class="fa-regular fa-clock"></i> ${timeStr}
              </span>
              <span class="text-emerald-600 font-medium text-[11px]">
                <i class="fa-solid fa-circle-check"></i> 同期済み
              </span>
            </div>
          </article>
        `;
      }).join('');
    }

    // フィルター切替
    window.filterCategory = function(cat) {
      currentFilter = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white');
        btn.classList.add('text-slate-600');
      });
      
      const activeBtnId = cat === 'all' ? 'tab-all' : cat === '直売所出品' ? 'tab-market' : 'tab-farm';
      const activeBtn = document.getElementById(activeBtnId);
      if(activeBtn) {
        activeBtn.classList.add('bg-emerald-600', 'text-white');
        activeBtn.classList.remove('text-slate-600');
      }

      renderPosts();
    };

    // データの投稿
    document.getElementById("agri-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-50");

      const category = document.getElementById("category").value;
      const title = document.getElementById("title").value;
      const department = document.getElementById("department").value;
      const details = document.getElementById("details").value;

      try {
        await addDoc(collection(db, "saijo_agri_posts"), {
          category: category,
          title: title,
          department: department,
          details: details,
          createdAt: serverTimestamp()
        });

        // フォームのリセット
        document.getElementById("title").value = "";
        document.getElementById("details").value = "";
      } catch (err) {
        alert("書き込みエラーが発生しました:\n" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-50");
      }
    });

    // データの削除
    window.deletePost = async function(id) {
      if (confirm("この記録を削除しますか？")) {
        try {
          await deleteDoc(doc(db, "saijo_agri_posts", id));
        } catch (err) {
          alert("削除に失敗しました: " + err.message);
        }
      }
    };

    // XSS対策用
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&< me"']/g, (m) => {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
  </script>
</body>
</html>
